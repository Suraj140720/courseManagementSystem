<div class="super-admin-container" style="margin-top: 80px;">
  <h1 class="page-title">Super Admin Dashboard</h1>

  <table>
    <thead>
      <tr>
        <th>Sr No.</th>
        <th>Email</th>
        <th>Password</th>
        <th>Username</th>
        <th>Mobile Number</th>
        <th>User Role</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let admin of adminUsers; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ admin.Email }}</td>
        <td>{{ admin.Password }}</td>
        <td>{{ admin.Username }}</td>
        <td>{{ admin.MobileNumber }}</td>
        <td>{{ admin.UserRole }}</td>
        <td><button (click)="updateStatus(admin, 'Approved')">Approve</button><button
            (click)="updateStatus(admin, 'Rejected')">Reject</button></td>
      </tr>
    </tbody>
  </table>
</div>

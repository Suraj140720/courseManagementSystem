<div class="add-application-container" style="margin-top: 110px;">
    <div class="header">
      <h2>Course Application Form</h2>
      <button class="btn btn-secondary back-button" (click)="goBack()">Back</button>
    </div>
    <div>
      <p>Course Name:{{courseName}}</p>
    </div>
    <form (ngSubmit)="onSubmit(applicationForm)" #applicationForm="ngForm">
      <div class="form-group">
        <label for="skills">Skills<span class="required">*</span></label>
        <textarea type="text" id="skills" [(ngModel)]="application.Skills" name="skills" required></textarea>
        <div *ngIf="applicationForm.submitted && !application.Skills" class="validation-message">
          Skills are required.
        </div>
      </div>
      <div class="form-group">
        <label for="educationlevel">Education Level<span class="required">*</span></label>
        <input type="text" id="educationlevel" [(ngModel)]="application.EducationLevel" name="educationlevel" required>
        <div *ngIf="applicationForm.submitted && !application.EducationLevel" class="validation-message">
          Education Level is required.
        </div>
      </div>
    
    <div class="form-group">
      <label for="experiencedetails">Experience Details<span class="required">*</span></label>
      <textarea type="text" id="experiencedetails" [(ngModel)]="application.ExperienceDetails" name="experiencedetails" required></textarea>
      <div *ngIf="applicationForm.submitted && !application.ExperienceDetails" class="validation-message">
        Experience Details are required.
      </div>
      </div>
      <div class="form-group">
        <label for="additionalnotes">Additional Notes</label>
        <textarea id="additionalnotes" [(ngModel)]="application.AdditionalNotes" name="additionalnotes"></textarea>
      </div>
      <div *ngIf="formSubmitted && applicationForm.invalid" class="validation-message">
        All fields are required.
      </div>
      <button type="submit" class="btn btn-success" style="width: 100%;">Submit</button>
    </form>
  </div>
